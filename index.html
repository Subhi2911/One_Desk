<!doctype html>
<html>
  <head>
    <meta charset="utf8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <style>
      :root {
        color-scheme: light;
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      body {
        margin: 0;
        padding: 0;
        font:
          14px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: #fff;
        color: #000;
      }
      img {
        max-width: 100%;
      }
      [hidden]:not([hidden="until-found" i]) {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <title>One Desk</title>
    <meta name="claude:viewport-fit-sides" content="cover" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* Layout: navy rail on the left that collapses to icons, white header band, scrolling content, pinned footer.
   Palette comes from the supplied colour list: navy 0B1F3B / 0F172A, blue 2563EB, soft blue 6FADFF, status pastels. */
      :root {
        --font:
          "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        --rail: #0b1f3b;
        --rail-2: #0f172a;
        --rail-ink: #e2e8f0;
        --rail-muted: #c0c0c0;
        --bg: #f3f4f6;
        --surface: #ffffff;
        --surface-2: #f8fafc;
        --tint: #f2f6ff;
        --zebra: #f3f4f6;
        --line: #d1d5db;
        --line-soft: #e2e8f0;
        --ink: #0f172a;
        --ink-2: #374151;
        --muted: #6b7280;
        --blue: #2563eb;
        --blue-press: #1d4ed8;
        --link: #2563eb;
        --blue-soft: #6fadff;
        --blue-soft-2: #a9ccff;
        --sky: #a5b4fc;
        --btn-dark: #0b1f3b;
        --btn-dark-ink: #ffffff;
        --chip: #0b1f3b;
        --footer: #2f5d9b;
        --footer-ink: #ffffff;
        --ok-bg: #93e9a7;
        --ok-ink: #125300;
        --warn-bg: #ffdf85;
        --warn-ink: #855c52;
        --bad-bg: #f8a8b4;
        --bad-ink: #af0000;
        --ok-text: #15803d;
        --warn-text: #b45309;
        --bad-text: #b91c1c;
        --amber: #f59e0b;
        --red: #dc2626;
        --green: #22c55e;
        --dot: #27b300;
        --dot-warn: #fcc21b;
        --track: #fcefd0;
        --rail-edge: #0b1f3b;
        --logout: #f8a8b4;
        --on-pastel: #0b1f3b;
        --shadow:
          0 1px 0 rgba(15, 23, 42, 0.04), 0 2px 6px rgba(15, 23, 42, 0.08);
        --shadow-btn: 0 3px 0 rgba(15, 23, 42, 0.18);
        --hdr-shadow: 0 2px 4px rgba(15, 23, 42, 0.18);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --rail: #060d1b;
          --rail-2: #050a15;
          --bg: #0a1020;
          --surface: #111a2e;
          --surface-2: #0e1627;
          --tint: #16233d;
          --zebra: #0e1627;
          --line: #2a3858;
          --line-soft: #1f2c47;
          --ink: #e6edf8;
          --ink-2: #c3cee0;
          --muted: #93a1b8;
          --link: #7fb0ff;
          --btn-dark: #1b2f52;
          --chip: #1b2f52;
          --footer: #1b3a66;
          --rail-edge: #7fb0ff;
          --ok-text: #4ade80;
          --warn-text: #fbbf24;
          --bad-text: #f87171;
          --track: #3a2f12;
          --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.35);
          --hdr-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
          color-scheme: dark;
        }
      }
      :root[data-theme="dark"] {
        --rail: #060d1b;
        --rail-2: #050a15;
        --bg: #0a1020;
        --surface: #111a2e;
        --surface-2: #0e1627;
        --tint: #16233d;
        --zebra: #0e1627;
        --line: #2a3858;
        --line-soft: #1f2c47;
        --ink: #e6edf8;
        --ink-2: #c3cee0;
        --muted: #93a1b8;
        --link: #7fb0ff;
        --btn-dark: #1b2f52;
        --chip: #1b2f52;
        --footer: #1b3a66;
        --rail-edge: #7fb0ff;
        --ok-text: #4ade80;
        --warn-text: #fbbf24;
        --bad-text: #f87171;
        --track: #3a2f12;
        --shadow: 0 1px 0 rgba(0, 0, 0, 0.3), 0 2px 6px rgba(0, 0, 0, 0.35);
        --hdr-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: var(--font);
        font-size: 14px;
        line-height: 1.45;
        -webkit-font-smoothing: antialiased;
      }
      button,
      input,
      select,
      textarea {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
      }
      a {
        color: var(--link);
      }
      :focus-visible {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }
      .ic {
        width: 20px;
        height: 20px;
        flex: none;
      }
      h1,
      h2,
      h3,
      p {
        margin: 0;
      }
      .tnum {
        font-variant-numeric: tabular-nums;
      }

      /* ---------- app shell ---------- */
      #root {
        height: 100%;
      }
      .app {
        display: flex;
        height: 100%;
        min-width: 0;
      }
      .side {
        width: 270px;
        flex: none;
        background: var(--rail);
        color: var(--rail-ink);
        display: flex;
        flex-direction: column;
        transition: width 0.25s ease;
        overflow: hidden;
        z-index: 30;
        padding-left: env(safe-area-inset-left, 0px);
      }
      .app.collapsed .side {
        width: 90px;
      }
      .brand {
        height: 120px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 20px 0 24px;
        flex: none;
      }
      .wordmark {
        display: flex;
        align-items: center;
        gap: 2px;
        font-size: 30px;
        font-weight: 500;
        color: #fff;
        letter-spacing: -0.5px;
        white-space: nowrap;
        text-decoration: none;
      }
      .wordmark img {
        display: block;
        height: 38px;
        width: auto;
        max-width: 100%;
      }
      .burger {
        background: none;
        border: 0;
        color: #fff;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        flex: none;
      }
      .burger:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .burger .ic {
        width: 30px;
        height: 30px;
      }
      .app.collapsed .wordmark {
        display: none;
      }
      .app.collapsed .brand {
        justify-content: center;
        padding: 0;
      }
      nav.menu {
        display: flex;
        flex-direction: column;
        margin-top: 8px;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 56px;
        padding: 0 24px;
        color: var(--rail-ink);
        text-decoration: none;
        font-size: 18px;
        font-weight: 500;
        white-space: nowrap;
        border: 0;
        background: none;
        width: 100%;
        text-align: left;
      }
      .nav-item .ic {
        width: 26px;
        height: 26px;
      }
      .nav-item:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      .nav-item.active {
        background: var(--blue);
        color: #fff;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.35);
      }
      .nav-item.logout {
        color: var(--logout);
        margin-top: 6px;
      }
      .app.collapsed .nav-item {
        justify-content: center;
        padding: 0;
      }
      .app.collapsed .nav-item span {
        display: none;
      }
      .main {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .hdr {
        background: var(--surface);
        box-shadow: var(--hdr-shadow);
        height: 120px;
        flex: none;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-left: max(28px, env(safe-area-inset-left, 0px));
        position: relative;
        z-index: 5;
      }
      .hdr-title {
        min-width: 0;
      }
      .hdr-title h1 {
        font-size: 28px;
        line-height: 1.15;
        font-weight: 700;
        letter-spacing: -0.4px;
        text-wrap: balance;
      }
      .hdr-title p {
        color: var(--ink-2);
        font-size: 15px;
        margin-top: 2px;
      }
      .hdr-right {
        display: flex;
        align-items: center;
        gap: 20px;
        flex: none;
        height: 100%;
      }
      .menu-btn {
        display: none;
        background: none;
        border: 0;
        width: 40px;
        height: 40px;
        border-radius: 8px;
        place-items: center;
        margin-left: -8px;
        color: var(--ink);
      }
      .clock {
        text-align: left;
        font-size: 13px;
        line-height: 1.5;
        color: var(--ink-2);
        white-space: nowrap;
      }
      .bell {
        position: relative;
        background: none;
        border: 0;
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        color: var(--ink-2);
        border-radius: 8px;
      }
      .bell .ic {
        width: 28px;
        height: 28px;
      }
      .bell.on {
        color: var(--blue);
      }
      .bell .badge {
        position: absolute;
        top: 2px;
        right: 2px;
        min-width: 18px;
        height: 18px;
        border-radius: 9px;
        background: var(--red);
        color: #fff;
        font-size: 11px;
        font-weight: 700;
        display: grid;
        place-items: center;
        padding: 0 4px;
      }
      .agent-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        background: var(--blue);
        color: #fff;
        border: 0;
        border-radius: 6px;
        height: 44px;
        padding: 0 16px;
        font-weight: 500;
        box-shadow: var(--shadow-btn);
      }
      .agent-btn:hover {
        background: var(--blue-press);
      }
      .user {
        display: flex;
        align-items: center;
        gap: 14px;
        height: 72px;
        background: var(--chip);
        color: #fff;
        border-radius: 40px 0 0 40px;
        padding: 0 max(24px, env(safe-area-inset-right, 0px)) 0 12px;
        text-decoration: none;
        font-weight: 500;
        font-size: 17px;
      }
      .user img {
        width: 48px;
        height: 48px;
        border-radius: 50%;
        object-fit: cover;
        display: block;
      }
      .hdr-link {
        font-size: 18px;
        font-weight: 500;
        padding-right: max(28px, env(safe-area-inset-right, 0px));
      }
      .content {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        container-type: inline-size;
        padding: 28px max(28px, env(safe-area-inset-right, 0px)) 32px
          max(28px, env(safe-area-inset-left, 0px));
      }
      .foot {
        flex: none;
        background: var(--rail);
        color: #fff;
        display: flex;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 4px 16px;
        padding: 14px max(28px, env(safe-area-inset-right, 0px)) 14px
          max(28px, env(safe-area-inset-left, 0px));
        font-size: 15px;
        padding-bottom: calc(14px + 0px);
      }
      .foot.blue {
        background: var(--footer);
        color: var(--footer-ink);
      }
      .scrim {
        position: fixed;
        inset: 0;
        background: rgba(5, 10, 21, 0.55);
        z-index: 25;
      }
      .view {
        max-width: 1180px;
        margin: 0 auto;
      }

      /* ---------- shared components ---------- */
      .card {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 6px;
      }
      .card.pad {
        padding: 20px;
      }
      .card h2,
      .card-title {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: -0.2px;
      }
      .card-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 12px;
      }
      .link-btn {
        background: none;
        border: 0;
        padding: 0;
        color: var(--link);
        text-decoration: underline;
        font-weight: 500;
        cursor: pointer;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        height: 40px;
        padding: 0 18px;
        border-radius: 6px;
        border: 1px solid transparent;
        font-weight: 600;
        font-size: 14px;
        text-decoration: none;
      }
      .btn.primary {
        background: var(--blue);
        color: #fff;
        box-shadow: var(--shadow-btn);
      }
      .btn.primary:hover {
        background: var(--blue-press);
      }
      .btn.dark {
        background: var(--btn-dark);
        color: var(--btn-dark-ink);
      }
      .btn.ghost {
        background: var(--surface);
        color: var(--ink);
        border-color: var(--line);
      }
      .btn.ghost:hover {
        background: var(--tint);
      }
      .btn.block {
        width: 100%;
      }
      .pill {
        display: inline-block;
        border-radius: 999px;
        padding: 3px 14px;
        font-size: 12px;
        font-weight: 500;
        white-space: nowrap;
      }
      .pill.ok {
        background: var(--ok-bg);
        color: var(--ok-ink);
      }
      .pill.warn {
        background: var(--warn-bg);
        color: var(--warn-ink);
      }
      .pill.bad {
        background: var(--bad-bg);
        color: var(--bad-ink);
      }
      .pill.info {
        background: var(--blue-soft);
        color: var(--on-pastel);
      }
      .pill.lg {
        padding: 6px 0;
        width: 146px;
        text-align: center;
        font-size: 15px;
      }
      .t-ok {
        color: var(--ok-text);
      }
      .t-warn {
        color: var(--warn-text);
      }
      .t-bad {
        color: var(--bad-text);
      }
      .tabs {
        display: flex;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 4px;
        overflow-x: auto;
        max-width: 100%;
      }
      .tabs button {
        flex: 1 0 auto;
        background: none;
        border: 0;
        border-left: 1px solid var(--line-soft);
        padding: 0 26px;
        height: 44px;
        color: var(--muted);
        font-size: 14px;
      }
      .tabs button:first-child {
        border-left: 0;
      }
      .tabs button[aria-selected="true"] {
        color: var(--ink);
        font-weight: 600;
        outline: 1px solid var(--blue);
        outline-offset: -1px;
        background: var(--surface);
        border-radius: 3px;
      }
      .filter-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 44px;
        padding: 0 28px;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 4px;
        font-size: 16px;
      }
      .filter-btn:hover {
        background: var(--tint);
      }
      .toolbar {
        display: flex;
        gap: 16px;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .tbl-wrap {
        overflow-x: auto;
        border: 1px solid var(--line-soft);
        background: var(--surface);
      }
      table {
        border-collapse: collapse;
        width: 100%;
        font-size: 13px;
      }
      th {
        background: var(--surface-2);
        text-align: left;
        font-weight: 700;
        padding: 9px 12px;
        border-bottom: 1px solid var(--line-soft);
        white-space: nowrap;
      }
      td {
        padding: 10px 12px;
        white-space: nowrap;
      }
      tbody tr:nth-child(even) {
        background: var(--zebra);
      }
      td.wrap {
        white-space: normal;
        min-width: 220px;
      }
      .muted {
        color: var(--muted);
      }
      .empty {
        padding: 36px 16px;
        text-align: center;
        color: var(--muted);
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        min-width: 0;
      }
      .field label {
        font-weight: 600;
        font-size: 14px;
      }
      .field .req {
        color: var(--red);
      }
      .input {
        height: 40px;
        border: 1px solid var(--line);
        background: var(--surface);
        border-radius: 4px;
        padding: 0 12px;
        width: 100%;
        min-width: 0;
      }
      .input::placeholder {
        color: var(--muted);
      }
      .input[readonly] {
        background: var(--surface-2);
      }
      .input.big {
        height: 56px;
        font-size: 16px;
        padding: 0 20px;
        border-radius: 4px;
      }
      .err {
        color: var(--bad-text);
        font-size: 13px;
      }
      .search-wrap {
        position: relative;
      }
      .search-wrap .ic {
        position: absolute;
        left: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
      }
      .search-wrap .input {
        padding-left: 50px;
      }

      /* ---------- login ---------- */
      .login {
        min-height: 100%;
        display: grid;
        place-items: center;
        padding: 24px max(16px, env(safe-area-inset-left, 0px));
        background: var(--bg);
      }
      .login-card {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        border-radius: 4px;
        width: min(650px, 100%);
        padding: 40px clamp(20px, 6vw, 32px) 48px;
      }
      .login-card .logo {
        display: grid;
        place-items: center;
      }
      .login-card h1 {
        text-align: center;
        font-size: 20px;
        font-weight: 700;
        margin-top: 8px;
      }
      .login-card .sub {
        text-align: center;
        color: var(--muted);
        font-size: 14px;
        margin-bottom: 26px;
      }
      .login-card form {
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .login-card .input {
        height: 40px;
        font-size: 16px;
      }
      .login-btn {
        height: 32px;
        background: var(--rail);
        color: #fff;
        border: 0;
        border-radius: 4px;
        font-weight: 600;
        font-size: 16px;
        height: 40px;
      }
      .login-btn:hover {
        background: var(--rail-2);
      }
      .login-card .forgot {
        text-align: center;
        margin-top: 6px;
      }

      /* ---------- dashboard ---------- */
      .stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 20px;
      }
      .stat {
        background: var(--surface);
        border: 1px solid var(--line);
        border-left-width: 5px;
        border-radius: 4px;
        padding: 16px 20px;
        box-shadow: var(--shadow);
      }
      .stat .l {
        font-size: 16px;
        font-weight: 600;
      }
      .stat .v {
        font-size: 30px;
        font-weight: 700;
        margin-top: 4px;
        letter-spacing: -0.5px;
      }
      .sec {
        font-size: 20px;
        font-weight: 600;
        margin: 28px 0 14px;
      }
      .qa {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
      }
      .qa button {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        height: 56px;
        background: var(--btn-dark);
        color: var(--btn-dark-ink);
        border: 1px solid transparent;
        border-radius: 6px;
        font-weight: 600;
        font-size: 16px;
        padding: 0 12px;
        box-shadow: var(--shadow);
      }
      .qa button:hover {
        background: var(--blue);
      }
      .qa .ic {
        width: 24px;
        height: 24px;
      }
      .dash-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr);
        gap: 24px;
        margin-top: 28px;
        align-items: start;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 24px;
        min-width: 0;
      }
      .sched {
        display: grid;
        grid-template-columns: 1.2fr 1fr 1fr;
        gap: 12px;
        padding-bottom: 12px;
        border-bottom: 1px solid var(--line-soft);
      }
      .sched .k {
        color: var(--muted);
        font-size: 15px;
      }
      .sched .v {
        font-size: 18px;
        font-weight: 600;
        margin-top: 2px;
      }
      .sched .s {
        font-size: 12px;
        color: var(--muted);
      }
      .sched .r {
        text-align: right;
      }
      .alert-row {
        display: flex;
        gap: 8px;
        align-items: center;
        color: var(--bad-text);
        font-size: 14px;
        padding: 12px 0 4px;
      }
      .row-between {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
      }
      .leaves {
        padding: 10px 0 12px;
        border-bottom: 1px solid var(--line-soft);
        font-weight: 500;
      }
      .reimb h3 {
        font-size: 15px;
        font-weight: 700;
        padding: 12px 0 6px;
      }
      .reimb .line {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 5px 0;
        color: var(--muted);
      }
      .wfh {
        margin-top: 14px;
        background: var(--blue-soft-2);
        color: var(--on-pastel);
        border-radius: 6px;
        padding: 14px 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
      }
      .wfh b {
        font-size: 16px;
        display: block;
      }
      .wfh span {
        font-size: 12px;
      }
      .wfh .btn {
        background: #0b1f3b;
        color: #fff;
        height: 36px;
      }
      .pay-top {
        display: flex;
        align-items: center;
        gap: 24px;
        margin-bottom: 12px;
      }
      .donut {
        width: 132px;
        height: 132px;
        flex: none;
        position: relative;
      }
      .donut svg {
        width: 100%;
        height: 100%;
        transform: rotate(-90deg);
      }
      .donut .mid {
        position: absolute;
        inset: 0;
        display: grid;
        place-content: center;
        text-align: center;
      }
      .donut .mid b {
        font-size: 22px;
      }
      .donut .mid span {
        font-size: 12px;
        color: var(--muted);
      }
      .pay-top .k {
        color: var(--ink-2);
        font-size: 16px;
      }
      .pay-top .v {
        font-size: 32px;
        font-weight: 700;
        letter-spacing: -0.5px;
      }
      .kv {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-top: 1px solid var(--line-soft);
      }
      .kv .k {
        color: var(--muted);
      }
      .kv .v {
        font-weight: 600;
      }
      .ann {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }
      .ann > div {
        border-left: 3px solid var(--rail);
        padding-left: 14px;
      }
      .ann .tag {
        font-size: 14px;
        letter-spacing: 0.3px;
      }
      .ann b {
        display: block;
        font-size: 13px;
        margin-top: 10px;
      }
      .ann p {
        font-size: 12px;
        color: var(--ink-2);
        margin-top: 6px;
      }
      .ann-foot {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-top: 1px solid var(--line);
        margin-top: 22px;
        padding-top: 12px;
        font-size: 12px;
        color: var(--muted);
      }
      .ann-foot i {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--dot);
        margin-right: 6px;
      }
      .events {
        display: flex;
        flex-direction: column;
      }
      .events .ev {
        display: flex;
        gap: 12px;
        align-items: center;
        padding: 9px 0;
        border-top: 1px solid var(--line-soft);
      }
      .events .ev:first-child {
        border-top: 0;
      }
      .ev .date {
        width: 44px;
        flex: none;
        text-align: center;
        background: var(--tint);
        border-radius: 6px;
        padding: 4px 0;
        line-height: 1.1;
      }
      .ev .date b {
        display: block;
        font-size: 16px;
      }
      .ev .date span {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.6px;
        color: var(--muted);
      }
      .ev .t {
        font-weight: 600;
        font-size: 13px;
      }
      .ev .m {
        font-size: 12px;
        color: var(--muted);
      }
      .bday {
        width: 100%;
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--blue-soft);
        color: var(--on-pastel);
        border: 0;
        border-radius: 6px;
        padding: 8px 10px;
        text-align: left;
      }
      .bday i {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        background: #0b1f3b;
        color: #fff;
        display: grid;
        place-items: center;
        font-style: normal;
        font-weight: 600;
        flex: none;
      }
      .bday b {
        display: block;
        font-size: 13px;
      }
      .bday span {
        font-size: 11px;
      }
      .kudos {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
        margin-top: 12px;
      }
      .kudos div {
        background: var(--blue-soft-2);
        color: var(--on-pastel);
        border-radius: 6px;
        text-align: center;
        padding: 14px 8px;
      }
      .kudos b {
        font-size: 30px;
        display: block;
        line-height: 1.1;
      }
      .kudos span {
        font-size: 11px;
      }
      .badges {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .badges span {
        background: var(--blue-soft);
        color: var(--on-pastel);
        border-radius: 999px;
        padding: 2px 12px;
        font-size: 11px;
        font-weight: 600;
      }
      .recent th,
      .recent td {
        font-size: 14px;
      }
      .recent td:first-child {
        color: var(--ink-2);
      }
      .recent tbody tr:nth-child(even) {
        background: transparent;
      }
      .recent tbody tr {
        border-top: 1px solid var(--line-soft);
      }
      .recent td:last-child,
      .recent th:last-child {
        text-align: right;
      }

      /* ---------- services ---------- */
      .svc-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
        margin-top: 22px;
      }
      .svc {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        box-shadow: var(--shadow);
      }
      .svc .top {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .svc .ico {
        width: 46px;
        height: 46px;
        border-radius: 8px;
        background: var(--tint);
        display: grid;
        place-items: center;
        color: var(--ink);
      }
      .svc .ico .ic {
        width: 26px;
        height: 26px;
      }
      .svc h3 {
        font-size: 16px;
        font-weight: 600;
      }
      .svc p {
        color: var(--muted);
        font-size: 14px;
        flex: 1;
        min-height: 40px;
      }
      .svc .btn {
        height: 38px;
        font-weight: 500;
      }

      /* ---------- profile ---------- */
      .prof-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr);
        gap: 24px;
        align-items: start;
      }
      .person {
        display: flex;
        align-items: center;
        gap: 14px;
        padding-bottom: 14px;
        border-bottom: 1px solid var(--line-soft);
        margin-bottom: 12px;
      }
      .person img {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        object-fit: cover;
      }
      .person b {
        display: block;
        font-size: 16px;
      }
      .person span {
        font-size: 12px;
        color: var(--ink-2);
      }
      .dl {
        display: grid;
        grid-template-columns: minmax(110px, 0.9fr) 1.6fr;
        gap: 12px 16px;
        font-size: 13px;
        margin: 0;
      }
      .dl dt {
        font-weight: 600;
      }
      .dl dd {
        margin: 0;
        color: var(--ink-2);
        min-width: 0;
        overflow-wrap: anywhere;
      }
      .perf {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 16px;
        align-items: start;
      }
      .perf fieldset {
        border: 0;
        padding: 0;
        margin: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 13px;
      }
      .perf label {
        display: flex;
        gap: 8px;
        align-items: center;
        cursor: pointer;
      }
      .perf-chart {
        width: 100%;
        height: auto;
        display: block;
      }
      .perf-chart text {
        fill: var(--muted);
        font-size: 10px;
        font-family: var(--font);
      }
      .counts {
        display: grid;
        grid-template-columns: auto auto;
        gap: 8px 36px;
        justify-content: start;
        font-weight: 600;
        margin-top: 14px;
        font-size: 13px;
      }
      .counts .n {
        font-variant-numeric: tabular-nums;
      }
      .edit-form {
        display: grid;
        gap: 12px;
        margin-top: 6px;
      }

      /* ---------- notifications ---------- */
      .notif {
        background: var(--surface);
        border: 1px solid var(--line-soft);
      }
      .notif button.n {
        display: flex;
        align-items: center;
        gap: 16px;
        width: 100%;
        text-align: left;
        background: var(--surface);
        border: 0;
        border-top: 1px solid var(--line-soft);
        padding: 14px 16px;
        min-height: 64px;
      }
      .notif button.n:first-child {
        border-top: 0;
      }
      .notif button.n.unread {
        background: var(--tint);
      }
      .notif .dot {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        flex: none;
        background: var(--dot);
      }
      .notif .dot.warn {
        background: var(--dot-warn);
      }
      .notif .dot.read {
        opacity: 0.45;
      }
      .notif .t {
        color: var(--link);
        text-decoration: underline;
        font-size: 13px;
      }
      .notif .unread .t {
        font-weight: 600;
      }
      .notif .w {
        display: block;
        font-size: 11px;
        color: var(--ink-2);
        margin-top: 2px;
      }

      /* ---------- payslip ---------- */
      .crumbs {
        color: var(--muted);
        font-size: 13px;
      }
      .crumbs button {
        background: none;
        border: 0;
        color: inherit;
        padding: 0;
      }
      .crumbs button:hover {
        text-decoration: underline;
      }
      .ps-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .ps-actions {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
      }
      .monthbar {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 14px;
        background: var(--tint);
        border: 1px solid var(--line-soft);
        padding: 6px 12px;
        font-size: 15px;
        flex-wrap: wrap;
      }
      .monthbar button {
        background: none;
        border: 0;
        padding: 4px 6px;
        font-weight: 500;
        color: var(--ink-2);
      }
      .monthbar button.cur {
        font-weight: 700;
        color: var(--ink);
      }
      .monthbar .sep {
        width: 1px;
        height: 16px;
        background: var(--ink-2);
      }
      .emp-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
        margin: 24px 0;
        background: var(--surface);
        border: 1px solid var(--line-soft);
        padding: 12px;
      }
      .emp-strip small {
        display: block;
        color: var(--muted);
        font-size: 13px;
        letter-spacing: 0.4px;
        text-transform: uppercase;
      }
      .emp-strip b {
        font-size: 19px;
      }
      .ps-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
      }
      .ps-grid h3 {
        font-size: 17px;
        font-weight: 700;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--line-soft);
        margin-bottom: 6px;
      }
      .ps-line {
        display: flex;
        justify-content: space-between;
        padding: 7px 0;
        font-size: 15px;
      }
      .ps-total {
        display: flex;
        justify-content: space-between;
        padding-top: 10px;
        margin-top: 6px;
        border-top: 1px solid var(--line-soft);
        font-weight: 700;
        font-size: 15px;
      }
      .net {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        background: var(--tint);
        border: 1px solid var(--line-soft);
        padding: 16px 18px;
        margin-top: 24px;
      }
      .net b {
        font-size: 19px;
      }
      .net .amt {
        font-size: 26px;
      }

      /* ---------- help ---------- */
      .help-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr);
        gap: 40px;
        margin-top: 28px;
        align-items: start;
      }
      .help-grid h2 {
        font-size: 22px;
        font-weight: 600;
        margin-bottom: 14px;
      }
      .faq {
        border-bottom: 1px solid var(--line-soft);
      }
      .faq button {
        width: 100%;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        text-align: left;
        background: var(--surface);
        border: 0;
        border-top: 1px solid var(--line-soft);
        padding: 12px;
        font-size: 14px;
      }
      .faq button .ic {
        width: 16px;
        height: 16px;
        transition: transform 0.2s;
      }
      .faq button[aria-expanded="true"] .ic {
        transform: rotate(180deg);
      }
      .faq .a {
        background: var(--surface-2);
        padding: 12px 16px;
        font-size: 14px;
        color: var(--ink-2);
      }
      .contact {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .contact .c {
        background: var(--surface);
        border: 1px solid var(--line-soft);
        padding: 10px 12px;
      }
      .contact small {
        display: block;
        color: var(--muted);
        font-weight: 600;
        letter-spacing: 0.6px;
        font-size: 13px;
      }
      .contact b {
        display: block;
        font-size: 19px;
        font-weight: 600;
        overflow-wrap: anywhere;
      }

      /* ---------- leave form ---------- */
      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 20px 28px;
        margin-top: 20px;
      }
      .form-grid .full {
        grid-column: 1/-1;
      }
      .form-actions {
        display: flex;
        gap: 12px;
        margin-top: 36px;
        flex-wrap: wrap;
      }
      .file-row {
        display: flex;
        gap: 12px;
        align-items: center;
        flex-wrap: wrap;
      }

      /* ---------- settings ---------- */
      .set-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 24px;
        align-items: start;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        background: var(--surface);
        border: 0;
        padding: 8px 18px;
        border-left: 1px solid var(--line);
      }
      .seg button:first-child {
        border-left: 0;
      }
      .seg button[aria-pressed="true"] {
        background: var(--blue);
        color: #fff;
      }
      .toggle-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        padding: 12px 0;
        border-top: 1px solid var(--line-soft);
      }
      .toggle-row:first-of-type {
        border-top: 0;
      }
      .sw {
        position: relative;
        width: 44px;
        height: 24px;
        flex: none;
      }
      .sw input {
        position: absolute;
        inset: 0;
        opacity: 0;
        margin: 0;
        cursor: pointer;
      }
      .sw i {
        position: absolute;
        inset: 0;
        background: var(--line);
        border-radius: 12px;
        transition: background 0.2s;
        pointer-events: none;
      }
      .sw i::after {
        content: "";
        position: absolute;
        left: 3px;
        top: 3px;
        width: 18px;
        height: 18px;
        background: #fff;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .sw input:checked + i {
        background: var(--blue);
      }
      .sw input:checked + i::after {
        transform: translateX(20px);
      }
      .sw input:focus-visible + i {
        outline: 2px solid var(--blue);
        outline-offset: 2px;
      }

      /* ---------- agent, toast, modal ---------- */
      .agent {
        position: fixed;
        right: max(20px, env(safe-area-inset-right, 0px));
        bottom: calc(64px + env(safe-area-inset-bottom, 0px));
        width: min(360px, calc(100vw - 32px));
        max-height: min(520px, calc(100% - 160px));
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        box-shadow: 0 12px 32px rgba(0, 0, 0, 0.28);
        display: flex;
        flex-direction: column;
        z-index: 40;
        overflow: hidden;
      }
      .agent header {
        background: var(--chip);
        color: #fff;
        padding: 12px 14px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 600;
      }
      .agent header button {
        background: none;
        border: 0;
        color: #fff;
        font-size: 20px;
        line-height: 1;
        width: 28px;
        height: 28px;
      }
      .agent .log {
        flex: 1;
        overflow-y: auto;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-height: 160px;
      }
      .msg {
        max-width: 86%;
        padding: 8px 12px;
        border-radius: 12px;
        font-size: 13px;
      }
      .msg.bot {
        background: var(--tint);
        align-self: flex-start;
        border-bottom-left-radius: 3px;
      }
      .msg.me {
        background: var(--blue);
        color: #fff;
        align-self: flex-end;
        border-bottom-right-radius: 3px;
      }
      .msg .go {
        display: inline-block;
        margin-top: 6px;
      }
      .agent .chips {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        padding: 0 12px 8px;
      }
      .agent .chips button {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 12px;
      }
      .agent .chips button:hover {
        background: var(--tint);
      }
      .agent form {
        display: flex;
        gap: 8px;
        padding: 10px 12px;
        border-top: 1px solid var(--line-soft);
      }
      .agent form .input {
        height: 36px;
      }
      .agent form .btn {
        height: 36px;
        padding: 0 14px;
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: calc(72px + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        background: var(--rail);
        color: #fff;
        border: 1px solid var(--line);
        padding: 10px 18px;
        border-radius: 8px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
        z-index: 60;
        max-width: calc(100vw - 32px);
        font-size: 14px;
      }
      .modal-wrap {
        position: fixed;
        inset: 0;
        background: rgba(5, 10, 21, 0.6);
        display: grid;
        place-items: center;
        padding: 16px;
        z-index: 50;
      }
      .modal {
        background: var(--surface);
        color: var(--ink);
        border-radius: 8px;
        width: min(480px, 100%);
        max-height: calc(100% - 32px);
        overflow: auto;
        padding: 22px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      }
      .modal h2 {
        font-size: 18px;
        margin-bottom: 12px;
      }
      .modal .acts {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
        flex-wrap: wrap;
      }
      .modal .dl {
        margin-top: 4px;
      }

      /* ---------- responsive (by content width) ---------- */
      @container (max-width: 1040px) {
        .qa {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .dash-grid,
        .prof-grid,
        .help-grid,
        .set-grid {
          grid-template-columns: minmax(0, 1fr);
        }
        .svc-grid {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .stats {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
        .emp-strip {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
      @container (max-width: 560px) {
        .qa,
        .svc-grid,
        .ps-grid,
        .form-grid,
        .ann {
          grid-template-columns: minmax(0, 1fr);
        }
        .stats {
          grid-template-columns: minmax(0, 1fr);
        }
        .sched {
          grid-template-columns: 1fr 1fr;
        }
        .sched > :first-child {
          grid-column: 1/-1;
        }
        .pay-top {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
        .perf {
          grid-template-columns: minmax(0, 1fr);
        }
        .tabs button {
          padding: 0 16px;
        }
      }
      @media (max-width: 900px) {
        .side {
          position: fixed;
          inset: 0 auto 0 0;

        function inject() {
          var old = document.getElementById("od-patch");
          if (old) old.remove(); /* drop the earlier patch CSS */
          var s = document.createElement("style");
          s.id = "od-fit-css";
          s.textContent = CSS;
          document.body.appendChild(s); /* last in the document = wins */
        }
        if (document.body) inject();
        else document.addEventListener("DOMContentLoaded", inject);

        /* footer appears only when #content is scrolled to the bottom (or the page is too short to scroll) */
        function init() {
          var root = document.getElementById("root");
          if (!root) return;
          de.classList.add("od-foot-js");
          function sync() {
            var c = document.getElementById("content"),
              f = document.getElementById("foot");
            if (!c || !f) return;
            var max = c.scrollHeight - c.clientHeight;
            f.classList.toggle("show", max <= 48 || c.scrollTop >= max - 24);
          }
          document.addEventListener(
            "scroll",
            function (e) {
              if (e.target && e.target.id === "content") sync();
            },
            true,
          );
          window.addEventListener("resize", sync);
          new MutationObserver(function () {
            requestAnimationFrame(sync);
          }).observe(root, { childList: true, subtree: true });
          sync();
        }
        if (document.readyState === "complete") init();
        else window.addEventListener("load", init);
      })();

              ih = H - T - B;
            var max = Math.max.apply(null, d.a.concat(d.r, d.p));
            var step = max <= 5 ? 1 : max <= 10 ? 2 : 5,
              top = Math.ceil(max / step) * step || step;
            var xs = function (i) {

                '" y="' +

                '" text-anchor="middle">' +

                  '" r="3" fill="' +
                  k[1] +
                  '"/>';
              });
            });
            $("#chart", r).innerHTML = s + "</svg>";
            var t = function (a) {

            $("#counts", r).innerHTML =

              "</span>";

            i.addEventListener("change", function () {
              S.range = i.value;

          chart();

                    : "") +
                  "</button>";
              }
              $("#calDays", r).innerHTML = h;
              list();
            }
            $("#calDays", r).onclick = function (e) {
              var b = e.target.closest("[data-k]");
              if (!b) return;
              c.sel = b.dataset.k;
              var p = c.sel.split("-");
              c.y = +p[0];
              c.m = +p[1] - 1;
              draw();
            };
            $$("[data-c]", r).forEach(function (b) {
              b.onclick = function () {
                var d = new Date(c.y, c.m + +b.dataset.c, 1);
                c.y = d.getFullYear();
                c.m = d.getMonth();
                draw();
              };
            });
            $("#calToday", r).onclick = function () {
              var t = new Date();
              c.y = t.getFullYear();
              c.m = t.getMonth();
              c.sel = key(c.y, c.m, t.getDate());
              draw();
            };
            $("#addEv", r).onclick = function () {
              modal(
                "Add event",
                '<div class="edit-form">' +
                  fld("et", "Title", inp("et")) +
                  fld("ed", "Date", inp("ed", c.sel, "date")) +
                  fld("em", "Time", inp("em", "10:00", "time")) +
                  "</div>" +
                  ERR,
                OK("Add event"),
                function (w) {
                  $("#mOk", w).onclick = function () {
                    var t = $("#et", w).value.trim(),
                      d = $("#ed", w).value;
                    if (!t) return bad(w, "Give the event a title.");
                    if (!d) return bad(w, "Pick a date.");
                    X.events.push({
                      d: d,
                      t: t,
                      m: $("#em", w).value || "All day",
                      k: "event",
                    });
                    c.sel = d;
                    var p = d.split("-");
                    c.y = +p[0];
                    c.m = +p[1] - 1;
                    closeModal();
                    draw();
                    toast("Event added.");
                  };
                },
              );
            };
            draw();
            tick();
          };

          /* ---------- wire into the app ---------- */
          META.travel = [
            "Travel & Expenses",
            "Submit reimbursements and pre-travel authorizations",
          ];
          META.it = ["IT Support", "Raise tickets and order equipment"];
          META.benefits = [
            "Benefits & Insurance",
            "Manage your health insurance plan and dependents",
          ];
          META.training = [
            "Training & Development",
            "Browse the catalogue and track your learning",
          ];
          META.team = [
            "Team Spaces",
            "See who is in today and join team spaces",
          ];
          META.policy = [
            "Company Policy",
            "Read and acknowledge company policies",
          ];
          META.calendar = [
            "Calendar",
            "Events, holidays and leave at a glance",
          ];
          NAVOF.travel =
            NAVOF.it =
            NAVOF.benefits =
            NAVOF.training =
              "services";
          NAVOF.team = NAVOF.policy = "dashboard";
          NAVOF.calendar = "";
          [
            ["Travel & Expenses", "travel"],
            ["IT Support", "it"],
            ["Benefits & Insurance", "benefits"],
            ["Training & Development", "training"],
          ].forEach(function (p) {
            SERVICES.forEach(function (s) {
              if (s[0] === p[0]) s[3] = p[1];
            });
          });

          var st = document.createElement("style");
          st.id = "od-pages-css";
          st.textContent = `
.cal-wrap{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:20px;align-items:start}
@container (max-width:880px){.cal-wrap{grid-template-columns:minmax(0,1fr)}}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.cal-head h2{font-size:clamp(16px,.6vw + 11px,20px)}
.cal-nav{display:flex;gap:6px;align-items:center}
.icon-btn{width:34px;height:34px;border:1px solid var(--line);background:var(--surface);border-radius:6px;display:grid;place-items:center;color:var(--ink)}
.icon-btn:hover{background:var(--tint)}
.cal-dow,.cal-days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-dow span{text-align:center;font-size:12px;color:var(--muted);font-weight:600;padding:6px 0}
.cal-day{min-height:clamp(46px,5.2vw,78px);border:1px solid var(--line-soft);border-radius:6px;background:var(--surface);padding:5px 6px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0;overflow:hidden}
.cal-day:hover{background:var(--tint)}
.cal-day.we{background:var(--zebra)}
.cal-day.out{opacity:.4}
.cal-day b{font-size:13px;font-weight:600;width:24px;height:24px;display:grid;place-items:center;border-radius:50%}
.cal-day.today b{background:var(--btn-dark);color:#fff}
.cal-day.sel{outline:2px solid var(--ink);outline-offset:-2px}
.cal-day em{font-style:normal;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-2)}
@container (max-width:720px){.cal-day em{display:none}}
.dots{display:flex;gap:3px;flex-wrap:wrap;margin-top:auto}
.dots i,.legend i,.dot-k{display:inline-block;width:7px;height:7px;border-radius:50%;flex:none}
.k-event{background:var(--amber)}.k-holiday{background:var(--red)}.k-leave{background:var(--blue)}.k-pay{background:var(--green)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:14px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.now-card .time{font-size:clamp(30px,3vw,44px);font-weight:700;letter-spacing:-1px;line-height:1.1;margin:4px 0}
.dot-k{margin-top:6px}
a.clock{text-decoration:none;color:var(--ink-2);border-radius:8px;padding:4px 8px;cursor:pointer}
a.clock:hover{background:var(--tint)}
.av{width:44px;height:44px;border-radius:50%;background:var(--btn-dark);color:#fff;display:grid;place-items:center;font-weight:600;flex:none}
.bar{height:8px;border-radius:4px;background:var(--line-soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--green)}
.svc .btn[disabled]{opacity:.6;cursor:default}
`;
          document.body.appendChild(st);
        })();

        render();
      })();
    </script>
    <script id="od-extras">
      (function () {
        "use strict";

        var CSS = `
.od-task{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);cursor:pointer}
.od-task:first-of-type{border-top:0}
.od-task input{width:16px;height:16px;accent-color:#0B1F3B;flex:none;margin:0;cursor:pointer}
.od-task .tt{flex:1;min-width:0;font-weight:500;font-size:clamp(12.5px,.25vw + 9.5px,14px)}
.od-task .due{font-size:12px;color:var(--muted);white-space:nowrap}
.od-task .due.hot{color:var(--bad-text);font-weight:600}
.od-task.done .tt{text-decoration:line-through;color:var(--muted)}
.od-task.done .due{opacity:.6}
.od-count{font-size:12px;color:var(--muted)}
/* both dashboard columns end at the same line, whatever the screen size */
.dash-grid{align-items:stretch}
.dash-grid > .stack > .card:last-child{flex:1}
/* the app scrolls inside the content area, so hide the second (page) scrollbar */
html:has(.app),html:has(.app) body{overflow:hidden}
`;
        var st = document.createElement("style");
        st.id = "od-extras-css";
        st.textContent = CSS;
        (document.body || document.documentElement).appendChild(st);

        /* sample data: edit freely */
        var TASKS = [
          {
            t: "Fix missed punch (check-out)",
            due: "Today",
            hot: true,
            done: false,
          },
          {
            t: "Submit October timesheet",
            due: "Today",
            hot: true,
            done: false,
          },
          {
            t: "Complete Data Privacy refresher",
            due: "8 Nov",
            hot: false,
            done: false,
          },
          {
            t: "Review and sign updated policy",
            due: "14 Nov",
            hot: false,
            done: true,
          },
        ];

        function pending() {
          return TASKS.filter(function (x) {
            return !x.done;
          }).length;
        }

        function html() {
          return (
            '<article class="card pad" id="odTasks">' +
            '<div class="card-head"><h2>My Tasks</h2><span class="od-count" id="odCount">' +
            pending() +
            " pending</span></div>" +
            TASKS.map(function (x, i) {
              return (
                '<label class="od-task' +
                (x.done ? " done" : "") +
                '">' +
                '<input type="checkbox" data-t="' +
                i +
                '"' +
                (x.done ? " checked" : "") +
                ">" +
                '<span class="tt">' +
                x.t +
                "</span>" +
                '<span class="due' +
                (x.hot && !x.done ? " hot" : "") +
                '">' +
                x.due +
                "</span></label>"
              );
            }).join("") +
            "</article>"
          );
        }

        function build() {
          var col = document.querySelector(
            ".dash-grid > .stack",
          ); /* left column of the dashboard */
          if (!col || col.querySelector("#odTasks")) return;
          col.insertAdjacentHTML("beforeend", html());
          col
            .querySelector("#odTasks")
            .addEventListener("change", function (e) {
              var i = e.target && e.target.dataset ? e.target.dataset.t : null;
              if (i == null) return;
              TASKS[+i].done = e.target.checked;
              var row = e.target.closest(".od-task");
              row.classList.toggle("done", e.target.checked);
              row
                .querySelector(".due")
                .classList.toggle("hot", TASKS[+i].hot && !e.target.checked);
              col.querySelector("#odCount").textContent =
                pending() + " pending";
            });
        }

        /* the app re-renders the dashboard on every visit, so watch for it */
        new MutationObserver(build).observe(
          document.body || document.documentElement,
          { childList: true, subtree: true },
        );
        build();
      })();
    </script>
  </body>
</html>
